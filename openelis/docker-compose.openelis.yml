# OpenELIS Global LIS stack -- PARKED / NOT in the default PHU360 profile.
#
# The PHU360 default (docker-compose.yml) ships OpenMRS alone. This file keeps
# the OpenELIS Global 3.2.2 LIS stack runnable on its own (certgen + postgres +
# fhir-api + webapp + frontend + proxy). The OpenMRS <-> OpenELIS integration
# (labonfhir omod, gp_labonfhir.xml, OpenMRS keystore mount) is intentionally
# disabled and is preserved under ./parked-openmrs-integration for reference.
#
# Start the parked stack with:
#   docker compose -f openelis/docker-compose.openelis.yml up -d
# Stop it with:
#   docker compose -f openelis/docker-compose.openelis.yml down
#
#   OpenELIS UI:  https://localhost:18443  (self-signed; accept the warning)
#   fhir-api:     https://127.0.0.1:18445/fhir/
#   webapp:       https://127.0.0.1:18444  (legacy UI) / http://127.0.0.1:18080
#   postgres:     127.0.0.1:15432 (clinlims user, password = OE_DB_PASSWORD)
name: phu360-openelis

services:
  certs:
    image: itechuw/certgen:main
    container_name: oe-certs
    platform: linux/amd64
    restart: "no"
    environment:
      KEYSTORE_PW: "kspass"
      TRUSTSTORE_PW: "tspass"
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - keys-vol:/etc/ssl/private/
      - certs-vol:/etc/ssl/certs/

  db.openelis.org:
    image: itechuw/openelis-global-2-database:3.2.2.0
    container_name: openelisglobal-database
    platform: linux/amd64
    ports:
      - "127.0.0.1:15432:5432"
    restart: always
    env_file:
      - ./openelis/configs/database/database.env
    environment:
      DB_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
      DB_SUPERUSER_PASSWORD: ${OE_DB_SUPERUSER_PASSWORD:-admin}
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims"]
      interval: 10s
      timeout: 45s
      retries: 15

  fhir.openelis.org:
    image: itechuw/openelis-global-2-fhir:3.2.2.0
    container_name: external-fhir-api
    platform: linux/amd64
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:18445:8443"
    depends_on:
      db.openelis.org:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    restart: always
    environment:
      TZ: "Etc/UTC"
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/openelis-global/truststore -Djavax.net.ssl.trustStorePassword=tspass -Djavax.net.ssl.trustStoreType=pkcs12 -Djavax.net.ssl.keyStore=/etc/openelis-global/keystore -Djavax.net.ssl.keyStorePassword=kspass -Djavax.net.ssl.keyStoreType=pkcs12"
      CATALINA_OPTS: "-Dhapi.ssl.truststorepath=/etc/openelis-global/truststore -Dhapi.ssl.truststorepassword=tspass -Dhapi.ssl.keystorepath=/etc/openelis-global/keystore -Dhapi.ssl.keystorepassword=kspass"
      FHIR_DATASOURCE_URL: "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
      FHIR_DATASOURCE_USERNAME: "clinlims"
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
      FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
    volumes:
      - key_trust-store-volume:/etc/openelis-global

  oe.openelis.org:
    image: itechuw/openelis-global-2:3.2.2.0
    container_name: openelisglobal-webapp
    platform: linux/amd64
    depends_on:
      db.openelis.org:
        condition: service_healthy
      fhir.openelis.org:
        condition: service_started
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18444:8443"
    restart: always
    environment:
      DEFAULT_PW: "adminADMIN!"
      TZ: "Etc/UTC"
      CATALINA_OPTS: "-Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OE_DB_PASSWORD:-clinlims} -Doe.ssl.truststorepath=/etc/openelis-global/truststore -Doe.ssl.truststorepassword=tspass -Doe.ssl.keystorepath=/etc/openelis-global/keystore -Doe.ssl.keystorepassword=kspass"
      SSL_KEYSTORE_PATH: ${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-kspass}
      SSL_TRUSTSTORE_PATH: ${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
      SSL_TRUSTSTORE_PASSWORD: ${SSL_TRUSTSTORE_PASSWORD:-tspass}
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - ./openelis/configs/plugins/:/var/lib/openelis-global/plugins
      - ./openelis/configs/logs/oeLogs:/var/lib/openelis-global/logs
      - ./openelis/configs/logs/tomcatLogs/:/usr/local/tomcat/logs
      - ./openelis/configs/properties/:/var/lib/openelis-global/properties/
      - ./openelis/configs/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
      - ./openelis/configs/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
      - ./openelis/configs/programs/:/var/lib/openelis-global/programs
      - ./openelis/configs/configuration:/var/lib/openelis-global/configuration
      - ./openelis/configs/menu/menu_config.json:/var/lib/openelis-global/menu/menu_config.json
    secrets:
      - source: common.properties

  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:3.2.2.0
    container_name: openelisglobal-frontend
    platform: linux/amd64
    environment:
      CHOKIDAR_USEPOLLING: "true"
    tty: true
    depends_on:
      - oe.openelis.org

  proxy:
    image: itechuw/openelis-global-2-proxy:3.2.2.0
    container_name: openelisglobal-proxy
    platform: linux/amd64
    ports:
      - "127.0.0.1:18443:443"
    environment:
      OE_NGINX_CERT: ${OE_NGINX_CERT:-apache-selfsigned.crt}
      OE_NGINX_KEY: ${OE_NGINX_KEY:-apache-selfsigned.key}
    command:
      - /bin/sh
      - -c
      - "envsubst '$$OE_NGINX_CERT $$OE_NGINX_KEY' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    volumes:
      - certs-vol:/etc/nginx/certs/
      - keys-vol:/etc/nginx/keys/
      - ./openelis/configs/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
      frontend.openelis.org:
        condition: service_started

secrets:
  common.properties:
    file: ./openelis/configs/properties/common.properties

volumes:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  openelis-db-data: